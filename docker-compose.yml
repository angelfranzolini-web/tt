services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - APP_PASSWORD=${APP_PASSWORD:?Définissez APP_PASSWORD dans le fichier .env}
      - PORT=3000
      - DATA_FILE=/app/data/state.json
    volumes:
      - sysview_data:/app/data
    # Écoute uniquement en local — Apache (déjà en place sur ce serveur pour
    # les autres sites) fait le reverse proxy HTTPS vers ce port, comme pour
    # les autres conteneurs de cette machine (127.0.0.1:80xx->80/tcp).
    ports:
      - "127.0.0.1:8020:3000"

volumes:
  sysview_data:
