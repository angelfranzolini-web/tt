# Ne réécrit "Connection" en "upgrade" que pour les vraies requêtes de mise
# à niveau WebSocket — indispensable pour ne pas casser les requêtes HTTP
# normales tout en laissant passer le WebSocket de synchronisation temps réel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name sysview.yansys.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sysview.yansys.fr;

    ssl_certificate     /etc/letsencrypt/live/sysview.yansys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysview.yansys.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Garde la connexion WebSocket ouverte longtemps au lieu du timeout
        # par défaut de 60s.
        proxy_read_timeout 86400s;
    }
}
