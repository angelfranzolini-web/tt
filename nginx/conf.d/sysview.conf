# Ne réécrit "Connection" en "upgrade" que pour les vraies requêtes de mise
# à niveau WebSocket — indispensable pour ne pas casser les requêtes HTTP
# normales tout en laissant passer le WebSocket de synchronisation temps réel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ne pas annoncer la version de nginx (réduit l'info utile à un attaquant).
server_tokens off;

# Défense en profondeur en plus du rate-limit applicatif : limite les
# tentatives de connexion avant même qu'elles n'atteignent Node.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name sysview.yansys.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sysview.yansys.fr;

    ssl_certificate     /etc/letsencrypt/live/sysview.yansys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysview.yansys.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Un peu de marge au-dessus de la limite de 256 Ko appliquée par
    # l'application — bloque les requêtes anormalement volumineuses avant
    # qu'elles n'atteignent Node.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Garde la connexion WebSocket ouverte longtemps au lieu du timeout
        # par défaut de 60s.
        proxy_read_timeout 86400s;
    }
}
